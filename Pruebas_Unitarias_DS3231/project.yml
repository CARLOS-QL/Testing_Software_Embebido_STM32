:project:
  :name: Testing_DS3231
  :which_ceedling: gem
  :ceedling_version: 1.1.10
  :use_mocks: TRUE
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
  :include:
    - src/**
  :support:
    - test/support

:defines:
  :test:
    - TEST

:cmock:
  :plugins:
    - :ignore
    - :callback
    - :ignore_arg
    - :array
    - :return_thru_ptr
  :mock_prefix: mock_
  :enforce_strict_ordering: TRUE
  :fail_on_unexpected_calls: TRUE

:plugins:
  :load_paths: []
  :enabled:
    - report_tests_pretty_stdout
    - gcov

:gcov:
  :summaries: TRUE
  :report_task: FALSE
  :utilities:
    - gcovr
  :reports:
    - HtmlBasic
    - HtmlDetailed
